<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乌拉姆螺旋</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73;
    --line: #e5e5ea; --accent: #0071e3; --canvas: #fff; --dot: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d;
      --line: #2c2c2e; --accent: #0a84ff; --canvas: #0b0b0d; --dot: #f5f5f7;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 8px 0 0; }
  label { display: flex; align-items: center; gap: 8px; color: var(--muted); white-space: nowrap; }
  input[type=range] { width: 160px; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  button {
    border: 0; border-radius: 999px; padding: 6px 16px; font: inherit;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:active { opacity: .8; }
  #stats { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  main { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; background: var(--canvas); cursor: crosshair; }
  #tip {
    position: absolute; pointer-events: none; display: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 4px 10px; font-variant-numeric: tabular-nums; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  }
</style>
</head>
<body>
<header>
  <h1>乌拉姆螺旋</h1>
  <label>格子大小 <input id="size" type="range" min="1" max="40" value="4"> <span id="sizeVal">4</span> px</label>
  <label><input id="lines" type="checkbox" checked> 突出素数线</label>
  <label><input id="diag" type="checkbox"> 高亮欧拉多项式 n²+n+41</label>
  <label><input id="nums" type="checkbox" checked> 显示数字（格子够大时）</label>
  <button id="save">保存 PNG</button>
  <span id="stats"></span>
</header>
<main>
  <canvas id="c"></canvas>
  <div id="tip"></div>
</main>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const sizeEl = document.getElementById('size');
const sizeVal = document.getElementById('sizeVal');
const diagEl = document.getElementById('diag');
const linesEl = document.getElementById('lines');
linesEl.addEventListener('change', () => draw());
const numsEl = document.getElementById('nums');
const stats = document.getElementById('stats');
const tip = document.getElementById('tip');

let sieve = new Uint8Array(0); // sieve[n] = 1 表示 n 是素数
let layout = null;

// 埃拉托斯特尼筛
function buildSieve(max) {
  if (sieve.length > max) return;
  const s = new Uint8Array(max + 1).fill(1);
  s[0] = 0; if (max >= 1) s[1] = 0;
  for (let i = 2; i * i <= max; i++)
    if (s[i]) for (let j = i * i; j <= max; j += i) s[j] = 0;
  sieve = s;
}

// 以 1 为原点 (0,0)，向右出发、逆时针旋转；y 向上为正。返回格子 (x,y) 上的数。
function numberAt(x, y) {
  const k = Math.max(Math.abs(x), Math.abs(y));
  if (k === 0) return 1;
  const m = (2 * k + 1) ** 2; // 第 k 圈的最大值，位于右下角 (k,-k)
  if (y === -k) return m - (k - x);          // 底边
  if (x === -k) return m - 2 * k - (y + k);  // 左边
  if (y === k)  return m - 4 * k - (x + k);  // 顶边
  return m - 6 * k - (k - y);                // 右边
}

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const W = Math.round(rect.width * dpr), H = Math.round(rect.height * dpr);
  canvas.width = W; canvas.height = H;

  const cell = Math.max(1, Math.round(+sizeEl.value * dpr));
  // 保证行列数为奇数，使 1 正好在中心
  let cols = Math.floor(W / cell); if (cols % 2 === 0) cols--;
  let rows = Math.floor(H / cell); if (rows % 2 === 0) rows--;
  cols = Math.max(cols, 1); rows = Math.max(rows, 1);
  const hx = (cols - 1) / 2, hy = (rows - 1) / 2;
  const ox = Math.floor((W - cols * cell) / 2), oy = Math.floor((H - rows * cell) / 2);
  layout = { cell, hx, hy, ox, oy, dpr };

  const maxN = (2 * Math.max(hx, hy) + 1) ** 2;
  buildSieve(maxN);

  // 欧拉多项式的取值集合
  let euler = null;
  if (diagEl.checked) {
    euler = new Set();
    for (let n = 0; n * n + n + 41 <= maxN; n++) euler.add(n * n + n + 41);
  }

  ctx.fillStyle = css('--canvas');
  ctx.fillRect(0, 0, W, H);

  const dot = css('--dot'), accent = css('--accent'), muted = css('--muted'), line = css('--line');
  const gap = cell >= 6 ? Math.max(1, Math.round(cell * 0.08)) : 0;
  const showNums = numsEl.checked && cell / dpr >= 22;
  let primes = 0, total = 0;

  if (showNums) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  }

  // 素数网格，用于统计每个素数所在斜线上的“同伴”数量
  const P = new Uint8Array(cols * rows);
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      P[r * cols + c] = sieve[numberAt(c - hx, hy - r)];
  const useLines = linesEl.checked;
  const R = 7; // 沿两条对角线各看前后 R 格
  const lineScore = (c, r) => {
    let a = 0, b = 0;
    for (let d = -R; d <= R; d++) {
      if (!d) continue;
      const rr = r + d;
      if (rr < 0 || rr >= rows) continue;
      const c1 = c + d, c2 = c - d;
      if (c1 >= 0 && c1 < cols) a += P[rr * cols + c1];
      if (c2 >= 0 && c2 < cols) b += P[rr * cols + c2];
    }
    return Math.max(a, b);
  };

  for (let gy = -hy; gy <= hy; gy++) {
    for (let gx = -hx; gx <= hx; gx++) {
      const n = numberAt(gx, gy);
      const isP = sieve[n] === 1;
      total++; if (isP) primes++;
      const px = ox + (gx + hx) * cell, py = oy + (hy - gy) * cell;
      const hit = euler && euler.has(n);
      if (isP || hit) {
        ctx.fillStyle = hit ? accent : dot;
        if (useLines && !hit) {
          const s = lineScore(gx + hx, hy - gy);
          if (s >= 6) ctx.fillStyle = accent;
          else ctx.globalAlpha = s >= 4 ? 0.55 : 0.13;
        }
        if (hit && !isP) ctx.globalAlpha = 0.35;
        ctx.fillRect(px + gap, py + gap, cell - 2 * gap, cell - 2 * gap);
        ctx.globalAlpha = 1;
      } else if (n === 1 && cell >= 3) {
        ctx.fillStyle = accent;
        ctx.fillRect(px + gap, py + gap, cell - 2 * gap, cell - 2 * gap);
      } else if (showNums) {
        ctx.strokeStyle = line; ctx.lineWidth = 1;
        ctx.strokeRect(px + gap + .5, py + gap + .5, cell - 2 * gap - 1, cell - 2 * gap - 1);
      }
      if (showNums) {
        const s = String(n);
        ctx.font = `${Math.min(cell * 0.38, cell * 1.5 / s.length)}px -apple-system, "Segoe UI", sans-serif`;
        ctx.fillStyle = (isP || hit || n === 1) ? css('--canvas') : muted;
        ctx.fillText(s, px + cell / 2, py + cell / 2);
      }
    }
  }

  sizeVal.textContent = sizeEl.value;
  stats.textContent = `${cols}×${rows} 格 · 共 ${total.toLocaleString()} 个数 · 素数 ${primes.toLocaleString()} 个（${(primes / total * 100).toFixed(1)}%）`;
}

canvas.addEventListener('mousemove', e => {
  if (!layout) return;
  const r = canvas.getBoundingClientRect();
  const { cell, hx, hy, ox, oy, dpr } = layout;
  const gx = Math.floor(((e.clientX - r.left) * dpr - ox) / cell) - hx;
  const gy = hy - Math.floor(((e.clientY - r.top) * dpr - oy) / cell);
  if (Math.abs(gx) > hx || Math.abs(gy) > hy) { tip.style.display = 'none'; return; }
  const n = numberAt(gx, gy);
  tip.textContent = `${n.toLocaleString()} ${sieve[n] ? '· 素数' : ''}`;
  tip.style.display = 'block';
  const tx = e.clientX - r.left + 14, ty = e.clientY - r.top + 14;
  tip.style.left = Math.min(tx, r.width - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(ty, r.height - tip.offsetHeight - 8) + 'px';
});
canvas.addEventListener('mouseleave', () => tip.style.display = 'none');
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const v = Math.min(40, Math.max(1, +sizeEl.value + (e.deltaY < 0 ? 1 : -1)));
  if (v !== +sizeEl.value) { sizeEl.value = v; draw(); }
}, { passive: false });

document.getElementById('save').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = '乌拉姆螺旋.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});

sizeEl.addEventListener('input', draw);
diagEl.addEventListener('change', draw);
numsEl.addEventListener('change', draw);
window.addEventListener('resize', draw);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
draw();
</script>
</body>
</html>
